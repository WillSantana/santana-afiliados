version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: santana_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-santana_afiliados_db}
      POSTGRES_USER: ${DB_USER:-santana_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-santana_admin} -d ${DB_NAME:-santana_afiliados_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: santana_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: santana_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - USE_SQLITE=False
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: santana_celery_worker
    restart: always
    command: celery -A config worker -l info
    volumes:
      - ../backend:/app
    env_file:
      - ../.env
    environment:
      - USE_SQLITE=False
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: santana_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ==========================================
  # Gateway WhatsApp Opcional (Evolution API)
  # Para ativar execute: docker compose up -d evolution_api
  # ==========================================
  evolution_api:
    image: atendai/evolution-api:v2.2.3
    container_name: santana_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${WHATSAPP_API_TOKEN:-configure-a-random-key}
      - DATABASE_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
